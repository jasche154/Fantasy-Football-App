# Lint (CI runs `ruff check .`): ruff's default rules (errors and pyflakes), no style rules.
target-version = "py311"
extend-exclude = ["venv", "analysis_output"]

[lint]
select = ["E4", "E7", "E9", "F"]

[lint.per-file-ignores]
"tests/*" = ["F811"]        # pytest fixtures are imported from shared test modules and then named as parameters
"alembic/env.py" = ["E402"] # the app's path setup must run before its imports

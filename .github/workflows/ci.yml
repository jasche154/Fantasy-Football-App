name: CI

on:
  pull_request:
  push:
    branches: [main]

# a new push to a branch or PR cancels its unfinished run; every commit on main gets its own run
concurrency:
  group: ci-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt -r requirements-mcp.txt
      - run: ruff check .
      - run: python -m pytest -q -n auto --cov=. --cov-report=term
      # the time-budget tests skip under -n (they need the CPU to themselves): check them here, serially, untraced
      - run: python -m pytest -q -p no:xdist -p no:cacheprovider -k "budget or is_fast or cached_and_fast" tests/test_replay_game.py tests/test_replay_trades.py tests/test_replay_waiver_ai.py tests/test_replay_trade_ai.py tests/test_replay_pool.py tests/test_replay_values.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
